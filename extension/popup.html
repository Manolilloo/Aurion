<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- CABECERA COMPACTA -->
    <div class="header">
      <div class="brand">
        <span class="status-orb"></span>
        <span class="brand-title">AURION</span>
        <span class="brand-tag">SNIFFER</span>
      </div>
      <div class="status-pill" id="host-badge">ACTIVO</div>
    </div>

    <!-- TARJETA DEL SITIO ACTUAL -->
    <div class="hud-box">
      <div class="hud-box-header">
        <span class="hud-label">DOMINIO ACTUAL</span>
        <span class="hud-mini-chip">MONITOR</span>
      </div>
      <div class="hud-domain" id="site-domain">...</div>
      <button class="hud-btn-action" id="btn-toggle-site">Silenciar en este sitio</button>
    </div>

    <!-- TRANSMISIONES DETECTADAS EN LA PESTAÑA -->
    <div class="hud-box">
      <div class="hud-box-header">
        <span class="hud-label">TRANSMISIONES ENCONTRADAS</span>
        <span class="hud-mini-chip" id="streams-count">0</span>
      </div>
      <div class="blocked-list" id="detected-streams-list">
        <div style="font-size: 9.5px; color: #64748b; padding: 4px 0;">Buscando transmisiones...</div>
      </div>
    </div>

    <!-- BOTÓN DE FORZAR TRANSMISIÓN -->
    <button class="btn-god-popup" id="btn-send-manual">
      <span>ENVIAR STREAM PRINCIPAL ⚡</span>
    </button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
