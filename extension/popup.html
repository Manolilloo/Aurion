<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="header">
    <div class="logo-box">
      <span class="logo">AURION</span>
    </div>
    <span class="badge" id="host-badge">ACTIVO</span>
  </div>

  <div class="current-site-box">
    <div class="site-label">DOMINIO ACTUAL</div>
    <div class="site-domain" id="site-domain">...</div>

  <div class="settings-box">
    <div class="settings-title">SITIOS SILENCIADOS</div>
    <div class="blocked-list" id="blocked-list"></div>
  </div>

  <button class="btn-send-manual" id="btn-send-manual">FORZAR TRANSMISIÓN ⚡</button>

  <script src="popup.js"></script>
