<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="data:,">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aurion</title>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/utopia.css">
</head>
<body>

  <!-- ATMÓSFERA AMBIENTAL -->
  <div class="ambient-glow-system">
    <div class="ambient-layer ambient-primary" id="ambient-layer-1"></div>
    <div class="ambient-layer ambient-secondary" id="ambient-layer-2"></div>
  </div>

  <div class="top-nav">
    <div class="sites-dock" id="sites-dock">
      <div class="sites-trigger">SITIOS ▶</div>
      <div class="sites-items-box" id="sites-items-box"></div>
    </div>

    <div class="matrix-switch" id="btn-switch-mode">
      <div class="matrix-thumb"></div>
      <div class="matrix-opt active" id="mode-anime">ANIME</div>
      <div class="matrix-opt" id="mode-movie">CINE</div>
    </div>

    <div></div>
  </div>

  <div class="cockpit">
    <!-- COLUMNA IZQUIERDA -->
    <div class="glass-box" style="z-index: 10;">
      <div class="glass-inner">
        <div class="box-header">PIPELINE ACTIVO</div>
        <div class="queue-area" id="queue-list">
          <div style="text-align: center; color: var(--color-text-dim); font-size: 12px; margin-top: 40px;">
            A la espera de transmisiones...
          </div>
        </div>
        <div class="neu-controls">
          <button class="btn-neu" id="btn-clear">🧹 VACIAR</button>
          <button class="btn-neu" id="btn-paste">📋 PEGAR</button>
        </div>
      </div>
    </div>

    <!-- COLUMNA CENTRAL -->
    <div class="center-col" style="z-index: 30;">
      <div class="search-container">
        <input type="text" class="search-input" id="search-input" placeholder="Invoca un anime..." autocomplete="off">
        <div class="search-suggestions" id="search-suggestions"></div>
      </div>

      <div class="parallax-wrap" id="parallax-sensor">
        <div class="parallax-poster" id="main-poster">
          <div class="poster-info">
            <div class="poster-tags" id="poster-tags">SISTEMA LISTO</div>
            <div class="poster-title" id="poster-title">Esperando consulta...</div>
          </div>
        </div>
      </div>

      <div class="mag-wrapper" id="mag-wrap">
        <button class="btn-god" id="btn-master">
          <span class="btn-god-txt" id="mag-txt" data-target="INICIAR EXTRACCIÓN">INICIAR EXTRACCIÓN</span>
        </button>
      </div>
    </div>

    <!-- COLUMNA DERECHA: CONSOLA DE INGENIERÍA -->
    <div class="glass-box" style="z-index: 10;">
      <div class="glass-inner">
        <div class="box-header">INGENIERÍA MULTIMEDIA</div>
        <div class="settings-area">
          
          <div>
            <label class="section-label">DESTINO LOCAL</label>
            <div style="display: flex; gap: 8px;">
              <input type="text" class="search-input" id="cfg-dir" style="flex: 1; border-radius: 12px; padding: 12px; font-size: 11px; text-align: left;" value="J:\ANIME\animes">
              <button class="btn-neu" id="btn-browse-dir" style="padding: 0 16px; border-radius: 12px;" title="Buscar en explorador">📂</button>
            </div>
          </div>

          <div>
            <label class="section-label">PREFIJO DE SALIDA</label>
            <input type="text" class="search-input" id="cfg-prefix" style="width: 100%; border-radius: 12px; padding: 12px; font-size: 12px; text-align: left;" placeholder="[Aurion] Titulo...">
          </div>

          <!-- NUMERACIÓN TÁCTICA: TEMPORADA Y EPISODIO INICIAL -->
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
            <div>
              <label class="section-label">TEMPORADA</label>
              <div class="stepper-box" data-id="cfg-season" data-min="1" data-max="99">
                <button class="step-btn step-dec" type="button">−</button>
                <div class="step-viewport">
                  <span class="step-val" id="disp-cfg-season">1</span>
                </div>
                <button class="step-btn step-inc" type="button">+</button>
                <input type="hidden" id="cfg-season" value="1">
              </div>
            </div>
            <div>
              <label class="section-label">EPISODIO INICIAL</label>
              <div class="stepper-box" data-id="cfg-start-ep" data-min="1" data-max="9999">
                <button class="step-btn step-dec" type="button">−</button>
                <div class="step-viewport">
                  <span class="step-val" id="disp-cfg-start-ep">1</span>
                </div>
                <button class="step-btn step-inc" type="button">+</button>
                <input type="hidden" id="cfg-start-ep" value="1">
              </div>
            </div>
          </div>

          <!-- TOGGLE: INCLUIR PORTADA EN CARPETA -->
          <div class="toggle-card">
            <span class="toggle-label">GUARDAR PORTADA (FOLDER.JPG)</span>
            <label class="switch-toggle">
              <input type="checkbox" id="cfg-save-cover" checked>
              <span class="switch-slider"></span>
            </label>
          </div>

          <!-- CHIPS CON GLIDER DESLIZANTE -->
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
            <div>
              <label class="section-label">CALIDAD</label>
              <div class="chip-group" data-cfg="res">
                <div class="chip-glider"></div>
                <button class="chip-btn active" data-val="max">MAX</button>
                <button class="chip-btn" data-val="1080">1080p</button>
                <button class="chip-btn" data-val="720">720p</button>
              </div>
            </div>
            
            <div>
              <label class="section-label">CONTENEDOR</label>
              <div class="chip-group" data-cfg="fmt">
                <div class="chip-glider"></div>
                <button class="chip-btn active" data-val="mp4">.MP4</button>
                <button class="chip-btn" data-val="mkv">.MKV</button>
              </div>
            </div>
          </div>

          <!-- SELECTORES DE RENDIMIENTO -->
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
            <div>
              <label class="section-label">HILOS: <span id="val-threads" class="val-badge">32</span></label>
              <div class="chip-group" data-cfg="threads">
                <div class="chip-glider"></div>
                <button class="chip-btn active" data-val="32">32 H</button>
                <button class="chip-btn" data-val="16">16 H</button>
                <button class="chip-btn" data-val="8">8 H</button>
              </div>
            </div>
            
            <div>
              <label class="section-label">PARALELAS: <span id="val-simul" class="val-badge">20</span></label>
              <div class="chip-group" data-cfg="simul">
                <div class="chip-glider"></div>
                <button class="chip-btn active" data-val="20">20 S</button>
                <button class="chip-btn" data-val="10">10 S</button>
                <button class="chip-btn" data-val="5">5 S</button>
              </div>
            </div>
          </div>

          <!-- TELEMETRÍA DE ALMACENAMIENTO HUD -->
          <div class="telemetry-card" id="telemetry-box">
            <div class="telemetry-header">
              <span id="disk-drive-name">DISCO LOCAL</span>
              <span id="disk-free-txt">Calculando...</span>
            </div>
            <div class="telemetry-bar-bg">
              <div class="telemetry-bar-fill" id="disk-bar-fill" style="width: 0%;"></div>
            </div>
          </div>

        </div>
      </div>
    </div>
  </div>

  <script src="js/animations.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
